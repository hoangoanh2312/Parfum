# Stack Docker local: MongoDB replica set + Redis + Express API + React/Nginx.
# Sao chep server/.env.example -> server/.env, dien cac secret, sau do chay:
# docker compose up -d --build
services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval \"try { rs.status(); db.hello().isWritablePrimary ? quit(0) : quit(1) } catch (e) { try { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) } catch (_) {} quit(1) }\"",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      # Luon dung ha tang noi bo cua Compose; secret van lay tu server/.env.
   
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - PORT=5000
      - TRUST_PROXY=1
      - CLIENT_URL=http://localhost:8080
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"

  client:
    build:
      context: ./client
      args:
        # Browser goi cung origin; nginx se proxy /api sang service server.
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  mongo-data:
